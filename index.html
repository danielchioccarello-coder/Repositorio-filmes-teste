<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Streaming BR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header">
    <a class="logo" href="./">Catálogo<span class="logo-br">BR</span></a>
    <div id="conta" class="conta"></div>
  </header>

  <!-- Banner: o filme em destaque, com a imagem de fundo e o degradê de cinema -->
  <section id="hero" class="hero" aria-label="Filme em destaque">
    <div class="hero-backdrops" id="hero-backdrops"></div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-content" id="hero-content"></div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <main id="app">
    <nav id="abas" class="abas" aria-label="Listas" role="tablist"></nav>

    <section id="filters" class="filters" aria-label="Filtros">
      <div class="filter-row">
        <span class="filter-label">Serviços</span>
        <div id="providers" class="providers">
          <input id="provider-search" class="provider-search" type="search" placeholder="Buscar serviço..." aria-label="Buscar serviço" hidden>
          <div id="provider-list" class="provider-list"></div>
          <button id="provider-toggle" class="link-button" type="button">+ ver todos</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Gêneros</span>
        <div id="genres" class="genres"></div>
      </div>
    </section>

    <div class="row-head">
      <h2 id="row-title" class="row-title">Mais populares</h2>
      <p id="count" class="count" aria-live="polite"></p>
      <div id="row-controls" class="row-controls">
      <label class="sort-wrap">
        <span class="sort-label">Ordenar por</span>
        <select id="sort" class="sort">
          <option value="popularidade">Popularidade</option>
          <option value="nota">Nota</option>
          <option value="lancamento">Lançamento</option>
        </select>
      </label>
      <label class="sort-wrap">
        <span class="sort-label">Nota mínima</span>
        <select id="min-rating" class="sort">
          <option value="0">Qualquer nota</option>
          <option value="6">6+</option>
          <option value="7">7+</option>
          <option value="8">8+</option>
          <option value="9">9+</option>
        </select>
      </label>
      </div>
    </div>

    <div id="message" role="status" hidden></div>
    <section id="grid" class="grid" aria-label="Filmes"></section>
    <div class="load-more-wrap">
      <button id="load-more" class="load-more" type="button" hidden>Carregar mais filmes</button>
    </div>
  </main>
  <footer class="site-footer">
    Dados: <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a> ·
    Disponibilidade: <a href="https://www.justwatch.com" target="_blank" rel="noopener">JustWatch</a>
  </footer>
  <dialog id="details" class="details" aria-label="Detalhes do filme">
    <div class="details-inner">
      <button class="details-close" type="button" aria-label="Fechar">✕</button>
      <div id="details-body"></div>
    </div>
  </dialog>
  <dialog id="login" class="login" aria-labelledby="login-titulo">
    <div class="login-inner">
      <button class="details-close" type="button" aria-label="Fechar">✕</button>
      <h2 id="login-titulo" class="login-titulo">Entrar</h2>
      <p class="login-aviso" hidden></p>
      <form class="login-form">
        <label class="login-campo">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="login-campo">
          <span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" minlength="6" required>
        </label>
        <p class="login-erro" role="alert"></p>
        <button type="submit" class="btn btn-primary login-enviar">Entrar</button>
        <button type="button" class="link-button login-troca">Não tem conta? Criar conta</button>
      </form>
    </div>
  </dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
